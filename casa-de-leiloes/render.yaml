# Blueprint do Render: API (NestJS).
# O front-end vai na Vercel (root directory: frontend) e o banco no Supabase — ver README.md → Deploy.
# O banco não é criado aqui porque o PostgreSQL free do Render expira em 30 dias.

services:
  - type: web
    name: casa-de-leiloes-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: com NODE_ENV=production o npm pularia as devDependencies (nest-cli,
    # typescript, ts-node do seed, dotenv), que o build e a subida usam.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations a cada deploy; seed só se o banco estiver vazio (não apaga dados existentes).
    startCommand: npx prisma migrate deploy && (npm run db:seed -- --if-empty || echo "seed ignorado") && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Liga a trava que recusa segredos ausentes, curtos ou de exemplo.
      - key: NODE_ENV
        value: production
      # Deploy de DEMONSTRAÇÃO: libera o seed com as contas de senha pública (leilao123).
      # Num ambiente real, remova esta variável.
      - key: ALLOW_DEMO_SEED
        value: "true"
      # Connection string do Supabase, modo "Session pooler" (porta 5432, IPv4) — preencher no painel.
      # Não use o "Transaction pooler" (6543): o `prisma migrate deploy` precisa de sessão.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Gera a chave Ed25519 da auditoria e o HMAC dos pseudônimos.
      # NÃO troque depois de ter lances: as assinaturas antigas deixariam de validar.
      - key: AUDIT_SECRET
        generateValue: true
      - key: TS_NODE_TRANSPILE_ONLY
        value: "true"
      # URL do front na Vercel (ex.: https://casa-de-leiloes.vercel.app) — preencher no painel.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # E-mail de recuperação de senha via Brevo. Sem SMTP_HOST, nada é enviado e a API
      # registra um erro na subida. O Render free bloqueia as portas 25/465/587, por isso a 2525.
      # SMTP_USER/SMTP_PASS: login e chave SMTP do Brevo; MAIL_FROM: remetente verificado
      # no Brevo — preencher no painel.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ARTWORKS_API_URL
        value: https://api.artic.edu/api/v1
